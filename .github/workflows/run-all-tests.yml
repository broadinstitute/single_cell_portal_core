name: SCP Continuous Integration
on:
  push:
    branches:
      - development
      - main
  pull_request:
  workflow_dispatch:
env:
  DOCKER_IMAGE_NAME: "gcr.io/broad-singlecellportal-staging/single-cell-portal"
  GOOGLE_CLOUD_PROJECT: 'broad-singlecellportal-staging'
  RULE_NAME: ci-temp-allow-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  Run-All-Tests:
    permissions:
      contents: 'read'
      id-token: 'write'
    runs-on: ubuntu-24.04
    concurrency:
      group: 'Run-All-Tests'
      cancel-in-progress: false

    steps:
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check out repository code
        uses: actions/checkout@v5
      - name: Configure gcloud
        uses: ./.github/actions/setup-gcloud
        with:
          service_account_email: '839419950053-compute@developer.gserviceaccount.com'
          google_cloud_project: 'broad-singlecellportal-staging'
      - name: Get Runner Public IP
        id: ip
        run: echo "runner_ip=$(curl -s curl -s ipconfig.io)" >> "$GITHUB_OUTPUT"
      - name: Set up firewall rule for database connection
        run: |
          gcloud compute firewall-rules create ${{ env.RULE_NAME }} \
            --project=${{env.GOOGLE_CLOUD_PROJECT}} \
            --direction=INGRESS \
            --priority=1000 \
            --network=singlecell \
            --action=ALLOW \
            --rules=tcp:27017 \
            --source-ranges=${{ steps.ip.outputs.runner_ip }}/32 \
            --target-tags=mongodb
      - name: Build image and setup env
        id: build-image-setup-env
        uses: ./.github/actions/docker-build-env-setup
      - name: Load secrets and run tests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          RAILS_LOG_TO_STDOUT: true
          DOCKER_IMAGE_TAG: ${{ steps.build-image-setup-env.outputs.docker-tag }}
          SCP_CONFIG: 'scp-config-json'
          DEFAULT_SA: 'default-sa-keyfile'
          READONLY_SA: 'read-only-sa-keyfile'
          CI: true
        run: |
          bin/load_env_secrets.sh -p $SCP_CONFIG -s $DEFAULT_SA -r $READONLY_SA -g $GOOGLE_CLOUD_PROJECT -e test -v $DOCKER_IMAGE_TAG -n single-cell-portal-test
      - name: Delete Temporary Firewall Rule
        if: always() # Ensures cleanup happens even if previous steps fail
        run: |
          gcloud compute firewall-rules delete "${{ env.RULE_NAME }}" \
            --project="${{ env.GOOGLE_CLOUD_PROJECT }}" \
            --quiet
      - name: Preserve all test logs
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-logs
          path: |
            log/test.log
            log/delayed_job.test.log
